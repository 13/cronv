[package]
name = "cronv"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for managing cron jobs"
license = "MIT"
repository = "https://github.com/13/cronv"
readme = "README.md"
keywords = ["cron", "crontab", "tui", "terminal", "scheduler"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
