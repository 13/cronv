<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e44"/>
      <stop offset="1" stop-color="#16161f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#94e2d5"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- soft glow behind clock -->
  <circle cx="256" cy="212" r="150" fill="#89b4fa" opacity="0.07"/>

  <!-- clock ring -->
  <circle cx="256" cy="212" r="104" fill="none" stroke="url(#ring)" stroke-width="20"/>

  <!-- ticks 12 / 3 / 6 / 9 -->
  <g stroke="#585b70" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="128" x2="256" y2="146"/>
    <line x1="340" y1="212" x2="322" y2="212"/>
    <line x1="256" y1="296" x2="256" y2="278"/>
    <line x1="172" y1="212" x2="190" y2="212"/>
  </g>

  <!-- hands (10:10) -->
  <line x1="256" y1="212" x2="214" y2="177" stroke="#cdd6f4" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="212" x2="317" y2="164" stroke="#f9e2af" stroke-width="13" stroke-linecap="round"/>
  <circle cx="256" cy="212" r="13" fill="#94e2d5"/>

  <!-- firing timeline bars -->
  <g>
    <rect x="123" y="402" width="26" height="34" rx="13" fill="#89b4fa"/>
    <rect x="163" y="374" width="26" height="62" rx="13" fill="#94e2d5"/>
    <rect x="203" y="390" width="26" height="46" rx="13" fill="#89b4fa"/>
    <rect x="243" y="348" width="26" height="88" rx="13" fill="#f9e2af"/>
    <rect x="283" y="382" width="26" height="54" rx="13" fill="#94e2d5"/>
    <rect x="323" y="364" width="26" height="72" rx="13" fill="#89b4fa"/>
    <rect x="363" y="396" width="26" height="40" rx="13" fill="#94e2d5"/>
  </g>
</svg>
